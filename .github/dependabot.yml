version: 2
updates:
- package-ecosystem: nuget
  directory: "/src"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  ignore:
  # 18.10+ ships lib/ for net11.0 only, so the net10.0 test project gets no runtime assembly.
  # Lift once the repo targets net11.0.
  - dependency-name: "Microsoft.Build.*"
    versions: [">= 18.10.0"]
